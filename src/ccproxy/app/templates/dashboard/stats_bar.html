<div class="flex items-center gap-6 text-sm">
  <div class="flex items-center gap-1.5">
    <span class="text-neutral-500">Requests:</span>
    <span class="font-medium">{{ "{:,}".format(total) }}</span>
  </div>
  {% if total_cost_usd > 0 %}
    <div class="flex items-center gap-1.5">
      <span class="text-neutral-500">Total cost:</span>
      <span class="font-medium text-emerald-700">${{ "%.4f" % total_cost_usd }}</span>
    </div>
  {% endif %}
  {% if last_model %}
    <div class="flex items-center gap-1.5">
      <span class="text-neutral-500">Last:</span>
      <span class="font-mono text-xs">{{ last_model }}</span>
    </div>
  {% endif %}
</div>
